<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MYD Mobile - Core App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            position: fixed;
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #060913;
        }
        /* Ocultar scrollbars visuales pero permitir deslizamiento interno */
        .scroll-view {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .scroll-view::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-[#060913] text-slate-100 font-sans flex flex-col justify-between select-none">

    <div id="contenedorNotificaciones" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 space-y-2 w-11/12 max-w-sm pointer-events-none"></div>

    <div id="authGate" class="fixed inset-0 bg-[#060913] z-50 flex flex-col justify-center px-6">
        <div class="w-full max-w-sm mx-auto space-y-6">
            <div class="text-center">
                <div class="h-14 w-14 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center font-black text-white text-2xl mx-auto shadow-lg shadow-blue-500/20">M</div>
                <h2 id="authTitle" class="text-2xl font-black mt-4 text-white tracking-tight">Ingresar a MYD</h2>
                <p id="authSubtitle" class="text-xs text-slate-400 mt-1">Digita tus credenciales de acceso corporativo</p>
            </div>

            <form id="formLogin" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Seleccionar Perfil</label>
                    <select id="loginSelect" class="w-full bg-[#0e1326] border border-slate-800/60 rounded-xl p-3.5 text-sm text-white outline-none appearance-none focus:border-blue-500 transition"></select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Contraseña</label>
                    <div class="relative">
                        <input type="password" id="loginPassword" required class="w-full bg-[#0e1326] border border-slate-800/60 rounded-xl p-3.5 pr-12 text-sm text-white outline-none focus:border-blue-500 transition" placeholder="••••••••">
                        <button type="button" onclick="toggleVisibilidadPassword('loginPassword', this)" class="absolute right-0 top-0 h-full w-12 flex items-center justify-center text-slate-500 active:text-blue-400 text-lg focus:outline-none">👁️</button>
                    </div>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 active:scale-[0.98] text-white font-bold py-3.5 rounded-xl text-sm shadow-lg transition">Autenticar Cuenta</button>
                <p class="text-center text-xs text-slate-400">¿Nuevo usuario? <button type="button" onclick="conmutarAuth(true)" class="text-blue-400 font-bold hover:underline">Regístrate</button></p>
            </form>

            <form id="formRegistro" class="space-y-4 hidden">
                <input type="text" id="regNombre" required class="w-full bg-[#0e1326] border border-slate-800/60 rounded-xl p-3.5 text-sm text-white outline-none" placeholder="Nombre completo">
                <input type="email" id="regEmail" required class="w-full bg-[#0e1326] border border-slate-800/60 rounded-xl p-3.5 text-sm text-white outline-none" placeholder="Correo electrónico">
                <div class="relative">
                    <input type="password" id="regPassword" required class="w-full bg-[#0e1326] border border-slate-800/60 rounded-xl p-3.5 pr-12 text-sm text-white outline-none" placeholder="Asignar Contraseña">
                    <button type="button" onclick="toggleVisibilidadPassword('regPassword', this)" class="absolute right-0 top-0 h-full w-12 flex items-center justify-center text-slate-500 text-lg focus:outline-none">👁️</button>
                </div>
                <select id="regPlan" class="w-full bg-[#0e1326] border border-slate-800/60 rounded-xl p-3.5 text-sm text-white outline-none"><option value="Básico">Básico</option><option value="Premium">Premium</option></select>
                <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-3.5 rounded-xl text-sm transition">Crear Acceso</button>
                <p class="text-center text-xs text-slate-400">¿Ya tienes cuenta? <button type="button" onclick="conmutarAuth(false)" class="text-blue-400 font-bold hover:underline">Inicia Sesión</button></p>
            </form>
        </div>
    </div>

    <div id="appLayout" class="hidden flex-1 flex flex-col h-full w-full overflow-hidden relative">
        <header class="bg-[#0e1326] border-b border-slate-900/60 p-4 flex justify-between items-center shrink-0">
            <div class="flex items-center space-x-2">
                <div class="h-7 w-7 bg-blue-600 rounded-lg flex items-center justify-center font-black text-white text-xs">M</div>
                <div>
                    <h1 class="text-xs font-bold text-white leading-tight">MYD Ecosystem</h1>
                    <span id="badgeUserRol" class="text-[9px] text-slate-400 font-mono block">Sincronizando...</span>
                </div>
            </div>
            <button onclick="logout()" class="text-[10px] bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg font-bold text-rose-400 active:bg-rose-950/20">Salir</button>
        </header>

        <main class="flex-1 overflow-y-auto scroll-view p-5 pb-24 space-y-6">
            
            <section id="mod-dashboard" class="modulo-page space-y-4">
                <div class="bg-[#0e1326] border border-slate-800/50 p-5 rounded-2xl">
                    <span class="text-[9px] text-blue-400 font-bold uppercase tracking-wider">Productividad Semanal</span>
                    <h3 id="dashProdTxt" class="text-3xl font-black mt-1">0%</h3>
                    <div class="w-full bg-slate-950 h-2 rounded-full mt-3 overflow-hidden"><div id="dashProdBar" class="bg-blue-500 h-full w-0 transition-all duration-500"></div></div>
                </div>
                <div class="bg-[#0e1326] border border-slate-800/50 p-5 rounded-2xl">
                    <span class="text-[9px] text-emerald-400 font-bold uppercase tracking-wider">Billetera / Balance</span>
                    <h3 id="dashFinTxt" class="text-3xl font-black mt-1">COP $0</h3>
                    <div class="w-full bg-slate-950 h-2 rounded-full mt-3 overflow-hidden"><div id="dashFinBar" class="bg-emerald-500 h-full w-0 transition-all duration-500"></div></div>
                </div>
            </section>

            <section id="mod-tareas" class="modulo-page hidden space-y-4">
                <h2 class="text-lg font-black text-white">Tareas del Día</h2>
                <form id="formTarea" class="bg-[#0e1326] p-4 rounded-xl border border-slate-800/40 space-y-3">
                    <input type="hidden" id="taskEditId">
                    <input type="text" id="taskInput" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white outline-none" placeholder="Nueva actividad...">
                    <input type="date" id="taskDate" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white">
                    <button type="submit" class="w-full bg-blue-600 py-2.5 rounded-lg text-sm font-bold">Agregar Agenda</button>
                </form>
                <div class="bg-[#0e1326] border border-slate-800/40 rounded-xl divide-y divide-slate-900" id="listaTareas"></div>
            </section>

            <section id="mod-finanzas" class="modulo-page hidden space-y-4">
                <h2 class="text-lg font-black text-white">Movimientos</h2>
                <form id="formFinanzas" class="bg-[#0e1326] p-4 rounded-xl border border-slate-800/40 space-y-3">
                    <select id="finTipo" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white"><option value="Ingreso">Ingreso (+)</option><option value="Gasto">Gasto (-)</option></select>
                    <input type="number" id="finMonto" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white" placeholder="Monto COP">
                    <input type="text" id="finConcepto" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white" placeholder="Concepto">
                    <button type="submit" class="w-full bg-emerald-600 py-2.5 rounded-lg text-sm font-bold">Registrar</button>
                </form>
            </section>

            <section id="mod-seguridad" class="modulo-page hidden space-y-4">
                <h2 class="text-lg font-black text-white">Ajustes de Seguridad</h2>
                <form id="formCambioPassword" class="bg-[#0e1326] p-4 rounded-xl border border-slate-800/40 space-y-4">
                    <div>
                        <label class="block text-[10px] text-slate-400 font-bold uppercase mb-1">Contraseña Actual</label>
                        <div class="relative">
                            <input type="password" id="pwdActual" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 pr-12 text-sm text-white outline-none" placeholder="••••••••">
                            <button type="button" onclick="toggleVisibilidadPassword('pwdActual', this)" class="absolute right-0 top-0 h-full w-12 flex items-center justify-center text-slate-500 text-lg">👁️</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 font-bold uppercase mb-1">Nueva Contraseña</label>
                        <div class="relative">
                            <input type="password" id="pwdNueva" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 pr-12 text-sm text-white outline-none" placeholder="Mínimo 6 dígitos">
                            <button type="button" onclick="toggleVisibilidadPassword('pwdNueva', this)" class="absolute right-0 top-0 h-full w-12 flex items-center justify-center text-slate-500 text-lg">👁️</button>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 py-3 rounded-lg text-xs font-bold">Cambiar Credenciales</button>
                </form>
            </section>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 h-16 bg-[#0e1326]/95 border-t border-slate-900/80 backdrop-blur-md flex justify-around items-center z-40">
            <button onclick="cambiarModulo('mod-dashboard')" class="btn-nav active flex flex-col items-center justify-center text-blue-500 w-12 h-12"><span class="text-lg">📊</span><span class="text-[9px] mt-0.5">Home</span></button>
            <button onclick="cambiarModulo('mod-tareas')" class="btn-nav flex flex-col items-center justify-center text-slate-400 w-12 h-12"><span class="text-lg">📋</span><span class="text-[9px] mt-0.5">Tareas</span></button>
            <button onclick="cambiarModulo('mod-finanzas')" class="btn-nav flex flex-col items-center justify-center text-slate-400 w-12 h-12"><span class="text-lg">💰</span><span class="text-[9px] mt-0.5">Cash</span></button>
            <button onclick="cambiarModulo('mod-seguridad')" class="btn-nav flex flex-col items-center justify-center text-slate-400 w-12 h-12"><span class="text-lg">🔒</span><span class="text-[9px] mt-0.5">Ajustes</span></button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
